<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>国风小博客</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "宋体", sans-serif;
        }

        body {
            background-color: #FAF5EE;
            color: #5C3A21;
            font-size: 15px;
            line-height: 1.8;
            padding-bottom: 100px;
        }

        .blog-header {
            background: linear-gradient(#A8201A, #8B1A15);
            text-align: center;
            padding: 25px 15px;
        }

        .blog-header h1 {
            color: #F9EAD3;
            font-size: 24px;
            letter-spacing: 4px;
            font-weight: normal;
        }

        .blog-header p {
            color: #F0D9B5;
            font-size: 13px;
            margin-top: 6px;
        }

        .nav-bar {
            display: flex;
            justify-content: space-around;
            background: #F3E4CD;
            padding: 12px 0;
            border-bottom: 1px solid #D9BC94;
            position: sticky;
            top: 0;
            z-index: 99;
        }

        .nav-item {
            color: #8B2323;
            font-size: 14px;
        }

        .nav-item.active {
            font-weight: bold;
            border-bottom: 2px solid #A8201A;
            padding-bottom: 3px;
        }

        .container {
            padding: 15px;
        }

        .cate-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
        }

        .cate-item {
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid #A8201A;
            font-size: 13px;
            color: #8B1A15;
        }

        .cate-item.active {
            background: #A8201A;
            color: #fff;
        }

        .publish-box {
            background: #fff;
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 20px;
            border: 1px solid #E8D9C3;
            box-shadow: 0 2px 6px rgba(139, 26, 21, 0.08);
        }

        .publish-box h3 {
            color: #8B1A15;
            margin-bottom: 12px;
            text-align: center;
            letter-spacing: 2px;
        }

        select, input, textarea {
            width: 100%;
            border: 1px solid #D9BC94;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 12px;
            background: #FAF5EE;
            outline: none;
            font-size: 14px;
        }

        textarea {
            min-height: 100px;
            resize: none;
        }

        .submit-btn {
            width: 100%;
            background: #A8201A;
            color: #fff;
            border: none;
            padding: 11px;
            border-radius: 6px;
            font-size: 15px;
            letter-spacing: 2px;
            margin-bottom:8px;
        }

        .article-card {
            background: #fff;
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 16px;
            border: 1px solid #E8D9C3;
            box-shadow: 0 2px 6px rgba(139, 26, 21, 0.08);
        }

        .article-title {
            font-size: 17px;
            color: #8B1A15;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .article-info {
            font-size: 12px;
            color: #A0826D;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .article-cate {
            color: #A8201A;
            border: 1px solid #A8201A;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .article-desc {
            color: #6B4F3A;
            font-size: 14px;
        }

        .btn-group {
            margin-top: 12px;
            display: flex;
            gap: 10px;
        }

        .edit-btn, .del-btn {
            flex: 1;
            text-align: center;
            padding: 6px 0;
            border-radius: 4px;
            font-size: 13px;
            border: none;
        }

        .edit-btn {
            background: #E8C39E;
            color: #5C3A21;
        }

        .del-btn {
            background: #A8201A;
            color: #fff;
        }

        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, #C8A988, transparent);
            margin: 20px 0;
        }

        .mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 999;
        }

        .edit-pop {
            width: 90%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            background: #FAF5EE;
            padding: 20px;
            border-radius: 8px;
        }

        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #8B1A15;
            text-align: center;
            padding: 10px 0;
            color: #F9EAD3;
            font-size: 12px;
        }
        /* 导入导出按钮 */
        .file-btn-row{
            display:flex;gap:10px;margin-bottom:15px;
        }
        .file-btn{
            flex:1;padding:8px;background:#E8C39E;color:#5C3A21;
            text-align:center;border-radius:6px;font-size:14px;
        }
        input#fileImport{display:none;}
    </style>
</head>
<body>
    <header class="blog-header">
        <h1>山河随笔 · 国风小筑</h1>
        <p>温一壶风月，写半生寻常</p>
    </header>

    <nav class="nav-bar">
        <div class="nav-item active">首页</div>
        <div class="nav-item">随笔</div>
        <div class="nav-item">生活</div>
        <div class="nav-item">关于</div>
    </nav>

    <div class="container">
        <!-- 导入导出按钮 -->
        <div class="file-btn-row">
            <label class="file-btn" for="fileImport">导入 blog.json</label>
            <div class="file-btn" onclick="exportFile()">保存到本地</div>
            <input type="file" id="fileImport" accept=".json" onchange="importFile(event)">
        </div>

        <div class="cate-wrap">
            <div class="cate-item active" data-cate="全部">全部</div>
            <div class="cate-item" data-cate="卮言">卮言</div>
            <div class="cate-item" data-cate="寓言">寓言</div>
            <div class="cate-item" data-cate="漫言">漫言</div>
        </div>

        <div class="publish-box">
            <h3>📝 发布新随笔</h3>
            <select id="artCate">
                <option value="卮言">卮言</option>
                <option value="寓言">寓言</option>
                <option value="漫言">漫言</option>
            </select>
            <input type="text" id="artTitle" placeholder="请输入文章标题">
            <textarea id="artContent" placeholder="请写下你的心事与感悟..."></textarea>
            <button class="submit-btn" onclick="addArticle()">发布文章</button>
        </div>

        <div class="divider"></div>
        <div id="articleList"></div>
    </div>

    <div class="mask" id="editMask">
        <div class="edit-pop">
            <select id="editCate">
                <option value="卮言">卮言</option>
                <option value="寓言">寓言</option>
                <option value="漫言">漫言</option>
            </select>
            <input type="text" id="editTitle" placeholder="修改标题">
            <textarea id="editContent" placeholder="修改内容"></textarea>
            <button class="submit-btn" onclick="saveEdit()">保存修改</button>
        </div>
    </div>

    <div class="footer">
        国风小博客 | 编辑后点「保存到本地」存为 blog.json
    </div>

    <script>
        let nowCate = "全部";
        let editIndex = 0;
        // 默认初始数据
        let articleArr = [
{
title:'practical life guide',
cate:'漫言',
time:'2026-05-06',
content:'在各种环境中，都该维护对应的人类社会生活指南。'
},
{
title:'道通天地，德行万物',
cate:'卮言',
time:'2026-05-05',
content:'用天地的道理来健康卮言，以万物的方法来和睦共处。'
},
{
title:'天下奔命于仁义，何其嚣嚣，其非人情，皆多骈旁枝之道。天下至正，守其性命之情。',
cate:'卮言',
time:'2026-05-05',
content:'正确的道路是健康卮言，直爽自如；非强求所谓仁义。'
},
{
title:'至人之用心若镜，不将不迎，应而不藏，胜物不伤。',
cate:'卮言',
time:'2026-05-05',
content:'心如明镜，随遇而安，保养自己，映照外物。'
},
{
title:'得者时也，失者顺也，安时处顺',
cate:'卮言',
time:'2026-05-05',
content:'天胜于物，获得的可能只是应时而至，失去的可能只是顺化而去。安宁地处理得失，就能免受哀乐的侵扰，如古人所说解了倒悬之苦。'
},
{
title:'形就心和，就不入，和不出，正吾身以达之。',
cate:'卮言',
time:'2026-05-05',
content:'人有过，可明示之，形就心和。同意外形和平且不妥协，保持内心平和且不张扬；做好自己的事，即可以正道引之。'
},
{
title:'与其他生命交互，传递信息',
cate:'卮言',
time:'2026-05-05',
content:'与其他生命交互，向其传递信息，有利于健康卮言，以免封闭精力于自身。总是想安全地与其他生命交互，比如养老鼠，甚至于独自打多人游戏。'
},
{
title:'宜守令行事，忌迁令劝成',
cate:'卮言',
time:'2026-05-05',
content:'守令行事，总能有所收获，是一种体验享受。成功自然会快乐，失败也不会后悔。因为最终的结果就是收获，我亲身积累了一段经历并凭此成长。迁令劝成，总会一无所有，是一种浪费烦恼。成功也不会快乐，失败自然会后悔。因为最初的选择令人迷茫，我总是不知道当初的选择是对是错。'
},
{
title:'事情要一件一件地办；事情要一点一点地办。',
cate:'卮言',
time:'2026-05-26',
content:'Handle matters one by one and step by step.'
},
{
title:'省点脑子',
cate:'卮言',
time:'2026-05-28',
content:'为了健康要省点脑子；过虑耗费精力，自乱阵脚。'
},
{
title:'我想做个好人',
cate:'寓言',
time:'2026-05-24',
content:'给普通老百姓一条做好人的路。'
},
{
title:'whatever',
cate:'漫言',
time:'2026-05-01',
content:'whatever'
}
        ];

        // 渲染文章
        function renderArticle() {
            const wrap = document.getElementById('articleList');
            wrap.innerHTML = '';
            let filterList = nowCate === "全部" ? articleArr : articleArr.filter(item => item.cate === nowCate);
            filterList.forEach((item) => {
                let realIdx = articleArr.findIndex(x=>x.time===item.time&&x.title===item.title);
                wrap.innerHTML += `
                    <div class="article-card">
                        <div class="article-title">${item.title}</div>
                        <div class="article-info">
                            <span>${item.time}</span>
                            <span class="article-cate">${item.cate}</span>
                        </div>
                        <div class="article-desc">${item.content}</div>
                        <div class="btn-group">
                            <button class="edit-btn" onclick="openEdit(${realIdx})">编辑</button>
                            <button class="del-btn" onclick="delArticle(${realIdx})">删除</button>
                        </div>
                    </div>
                `;
            })
        }

        // 新增文章
        function addArticle() {
            let title = document.getElementById('artTitle').value.trim();
            let content = document.getElementById('artContent').value.trim();
            let cate = document.getElementById('artCate').value;
            if(!title || !content){
                alert('标题和内容不能为空！');
                return;
            }
            let now = new Date();
            let timeStr = `${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2,0)}-${now.getDate().toString().padStart(2,0)}`;
            articleArr.unshift({title,content,time:timeStr,cate});
            document.getElementById('artTitle').value = '';
            document.getElementById('artContent').value = '';
            renderArticle();
            alert('发布成功！记得点【保存到本地】下载文件');
        }

        // 删除文章
        function delArticle(idx) {
            if(!confirm('确定要删除这篇文章吗？')) return;
            articleArr.splice(idx,1);
            renderArticle();
        }

        // 打开编辑弹窗
        function openEdit(idx) {
            editIndex = idx;
            let item = articleArr[idx];
            document.getElementById('editCate').value = item.cate;
            document.getElementById('editTitle').value = item.title;
            document.getElementById('editContent').value = item.content;
            document.getElementById('editMask').style.display = "block";
        }

        // 保存编辑
        function saveEdit() {
            articleArr[editIndex].cate = document.getElementById('editCate').value;
            articleArr[editIndex].title = document.getElementById('editTitle').value.trim();
            articleArr[editIndex].content = document.getElementById('editContent').value.trim();
            if(!articleArr[editIndex].title || !articleArr[editIndex].content){
                alert('标题内容不能为空！');
                return;
            }
            document.getElementById('editMask').style.display = "none";
            renderArticle();
            alert('修改成功！记得点【保存到本地】下载文件');
        }

        // 导出：保存到本地下载 blog.json
        function exportFile(){
            const jsonStr = JSON.stringify(articleArr,null,2);
            const blob = new Blob([jsonStr],{type:'application/json'});


            
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'blog.json';
            a.click();
            URL.revokeObjectURL(a.href);
            alert('已保存为 blog.json 到下载文件夹！');


            // 下载为 blog.txt
            let text = '';

            articleArr.forEach((article, index) => {
                text += `\{\n`;
                text += `title:\'${article.title}\'\,\n`;
                text += `cate:\'${article.cate}\'\,\n`;
                text += `time:\'${article.time}\'\,\n`;
                text += `content:\'${article.content}\'\n`;
                text += `\}\,\n`;
            });
            const blob2 = new Blob([text], { type: "text/plain" });
            
            const a2 = document.createElement('a');
            a2.href = URL.createObjectURL(blob2);
            a2.download = 'blog.txt';
            a2.click();
            URL.revokeObjectURL(a2.href);

        }

        // 导入：读取本地 blog.json
        function importFile(e){
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(ev){
                try{
                    const data = JSON.parse(ev.target.result);
                    if(Array.isArray(data)){
                        articleArr = data;
                        renderArticle();
                        alert('导入成功！');
                    }else{
                        alert('文件格式错误');
                    }
                }catch(err){
                    alert('解析JSON失败');
                }
            }
            reader.readAsText(file);
        }

        // 分类筛选点击
        document.querySelectorAll('.cate-item').forEach(el=>{
            el.addEventListener('click',()=>{
                document.querySelectorAll('.cate-item').forEach(c=>c.classList.remove('active'));
                el.classList.add('active');
                nowCate = el.dataset.cate;
                renderArticle();
            })
        })

        // 导航切换
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
            });
        });

        // 初始化
        renderArticle();
    </script>
</body>
</html>
